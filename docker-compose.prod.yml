services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-narko}
    # Port sengaja TIDAK di-export ke public di production demi keamanan.
    # App tetap bisa akses DB lewat docker network (host: db, port: 5432)
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-narko}']
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: 
      context: .
      dockerfile: Dockerfile
    restart: always
    ports:
      # Export port secara dinamis dari file .env
      - "${PORT:-3000}:${PORT:-3000}"
    environment:
      - NODE_ENV=production
      - PORT=${PORT:-3000}
      - DATABASE_URL=postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-narko}
      - SESSION_COOKIE=${SESSION_COOKIE:-sid}
      - SESSION_TTL_DAYS=${SESSION_TTL_DAYS:-7}
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
