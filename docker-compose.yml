services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: narko
    ports:
      - '3309:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d narko']
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    image: oven/bun:1
    working_dir: /app
    restart: unless-stopped
    volumes:
      - .:/app
    ports:
      - '3000:3000'
      - '5173:5173'
    environment:
      - DATABASE_URL=postgres://postgres:postgres@db:5432/narko
    command: bun run dev
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
